spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
#        default_batch_fetch_size: 0 # 💥 기본값을 0으로 해서 N+1을 유발합니다.
#        format_sql: true
        generate_statistics: true
#    show-sql: true

  sql:
    init:
      mode: never

  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  data:
    redis:
      repositories:
        enabled: false

jwt:
  secretKey: "test_secret_key_test_secret_key_test_secret_key_test_secret_key"
  refreshKey: "test_refresh_key_test_refresh_key_test_refresh_key_test_refresh_key"

cloud:
  aws:
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      access-key: test
      secret-key: test
    s3:
      bucket: test
