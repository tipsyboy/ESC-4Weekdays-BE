input {
  jdbc {
    # MariaDB JDBC 드라이버 파일 위치.
    # docker-compose에서 이 jar를 컨테이너 안으로 마운트해야 한다.
    jdbc_driver_library => "/usr/share/logstash/drivers/mariadb-java-client-3.3.3.jar"

    # MariaDB 전용 드라이버 클래스.
    jdbc_driver_class => "org.mariadb.jdbc.Driver"

    # 접속할 DB 주소.
    # 같은 docker network 안의 DB가 아니면 host.docker.internal 또는 실제 호스트 주소를 사용해야 한다.
    jdbc_connection_string => "${DB_URL}"

    # 계정 정보는 하드코딩하지 않고 환경변수로 뺀다.
    jdbc_user => "${DB_USERNAME}"
    jdbc_password => "${DB_PASSWORD}"

    # 연결 전에 유효성 검사를 해서 죽은 커넥션을 미리 걸러낸다.
    jdbc_validate_connection => true

    # 한 번에 너무 많은 데이터를 들고 오지 않도록 페이지 단위로 조회한다.
    jdbc_paging_enabled => false
    # jdbc_page_size => 500

    # updated_at 단독 기준은 동률 timestamp에서 누락이 생길 수 있다.
    # updated_at + product_id를 합친 단조 증가 numeric watermark를 사용한다.
    tracking_column => "tracking_value"
    tracking_column_type => "numeric"
    use_column_value => true
    last_run_metadata_path => "/usr/share/logstash/data/product-last-run.yml"

    # 지금은 학습/초기 검증 단계라 30초마다 한 번씩 실행한다.
    # 너무 짧게 잡으면 로그가 많아지고, 너무 길면 확인이 느리다.
    schedule => "*/30 * * * * *"

    # updated_at 동률에서 product_id로 tie-break 하도록 복합 watermark를 쓴다.
    statement => "
      SELECT
          p.product_id AS id,
          p.product_id AS product_id,
          p.name AS name,
          p.product_code AS product_code,
          p.unit_price AS unit_price,
          p.status AS status,
          v.vendor_id AS vendor_id,
          v.name AS vendor_name,
          p.created_at AS created_at,
          p.updated_at AS updated_at,
          (
            UNIX_TIMESTAMP(p.updated_at) * 1000000 + p.product_id
          ) AS tracking_value
      FROM product p
      LEFT JOIN vendor v ON v.vendor_id = p.vendor_id
      WHERE (
        UNIX_TIMESTAMP(p.updated_at) * 1000000 + p.product_id
      ) > :sql_last_value
      ORDER BY p.updated_at ASC, p.product_id ASC
    "
  }
}

filter {
  mutate {
    # DB에서 읽어온 id를 Elasticsearch 문서 ID로도 재사용한다.
    # 이렇게 해야 같은 상품이 다시 들어와도 새 문서가 생기지 않고 기존 문서를 덮어쓴다.
    copy => { "id" => "[@metadata][_id]" }
  }
}

output {
  elasticsearch {
    # 같은 docker-compose 네트워크 안에 있으면 서비스명으로 접근 가능하다.
    hosts => ["http://elasticsearch:9200"]

    # Product 검색용 인덱스.
    index => "products"

    # 문서 ID를 product_id로 고정한다.
    document_id => "%{[@metadata][_id]}"

    # 같은 ID가 들어오면 신규 생성이 아니라 덮어쓰도록 index 사용.
    action => "index"
  }

  stdout {
    # 콘솔에 이벤트를 같이 찍어서 디버깅하기 쉽게 한다.
    codec => rubydebug
  }
}
