version: '3.8'
services:
  elasticsearch:
    build:
      context: .
      dockerfile: infra/elk/elasticsearch/Dockerfile
    container_name: elasticsearch
    environment:
      - discovery.type=single-node # local 환경 싱글 노드
      - xpack.security.enabled=false # local 환경 보안 해제
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - 9200:9200
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - 5601:5601
    depends_on:
      - elasticsearch
    networks:
      - elk

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.2
    container_name: logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      DB_URL: ${LOGSTASH_DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./infra/elk/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      - ./infra/elk/logstash/pipeline:/usr/share/logstash/pipeline
      - ./infra/elk/logstash/drivers/mariadb-java-client-3.3.3.jar:/usr/share/logstash/drivers/mariadb-java-client-3.3.3.jar
    ports:
      - 9600:9600
    depends_on:
      - elasticsearch
    networks:
      - elk

networks:
  elk:
    driver: bridge
